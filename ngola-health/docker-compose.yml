# ****************************************************************
# Ngola-Health - docker-compose.yml (Ambiente De Desenvolvimento)
# *****************************************************************

services:
  # Base de Dados Relacional Postgrees
  postgres:
    image: postgres:18-alpine
    container_name: ngolahealth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - ngolahealth-network
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Base de dados em Memória Redis
  redis:
    image: redis:8-alpine
    container_name: ngolahealth-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ngolahealth-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend contruído com SpringBoot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ngolahealth-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      APPLICATION_NAME: ${APPLICATION_NAME}
    volumes:
      # maven cache
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ngolahealth-network
  
  # Frontend da aplicação (Angular)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: ngolahealth-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - ngolahealth-network
  
  # Servidor Web para gerenciar as requisições nginx
  nginx:
    image: nginx:alpine
    container_name: ngolahealth-nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8090:80"
    depends_on:
      - backend
      - frontend
    networks:
      - ngolahealth-network

# Volumes
volumes:
  postgres_data:
  redis_data:
  maven_cache:
  node_modules:
  
networks:
  ngolahealth-network:
    driver: bridge
    name: ngolahealth-network

