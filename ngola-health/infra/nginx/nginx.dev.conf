# ================================================
# Configuração do nginx — ambiente desenvolvimento
# Função: receber todos os pedidos na porta 80
# e encaminhar para o container correcto dentro da
# rede docker ngolahealth-network
#
# Regras de encaminhamento:
#   /api/*      -> backend:8080  (API SpringBoot)
#   /actuator/* -> backend:8080  (Health checks / métricas)
#   /ws/*       -> backend:8080  (WebSocket)
#   /*          -> frontend:4200 (Angular dev server)
# ================================================

# Eventos que definem como o nginx gere as ligações
events {
    # Número máximo de ligações simultâneas por worker
    worker_connections 1024;
}

http {
    # Dizer ao browser como interpretar cada tipo de ficheiro
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs de acesso e erros (para dev)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Grupos de servidores para onde o Nginx pode encaminhar pedidos
    upstream frontend_server {
        server frontend:4200;
    }

    upstream backend_server {
        server backend:8080;
    }

    # Servidor Principal
    server {
        listen 80;
        server_name localhost;

        # Tamanho máximo para envio de ficheiros
        client_max_body_size 25M;

        # Todos os pedidos que começam com /api vão para o backend
        location /api/ {
            proxy_pass http://backend_server;

            # Cabeçalhos para o SpringBoot saber quem fez o pedido originalmente
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            # Timeouts mais longos para operações demoradas
            proxy_connect_timeout   30s;
            proxy_send_timeout      120s;
            proxy_read_timeout      120s;
        }

        # Endpoint de monitorização do SpringBoot
        # Apenas para ambiente DEV (PRD deve ser protegido)
        location /actuator/ {
            proxy_pass                          http://backend_server;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        }

        # Rotas WS - Backend WebSocket
        location /ws/ {
            proxy_pass http://backend_server;

            # Cabeçalhos obrigatórios para WS
            proxy_http_version              1.1;
            proxy_set_header    Upgrade     $http_upgrade;
            proxy_set_header    Connection  "upgrade";
            proxy_set_header    Host        $host;

            # Manter a ligação WebSocket por 1h
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Rota Frontend
        # Tudo que não seja /api, /actuator ou /ws vai para o Angular.
        location / {
            proxy_pass http://frontend_server;

            # Cabeçalhos normais de proxy
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Hot-reload do Angular usa WebSocket internamente
            # Cabeçalhos para garantir que o hot-reload funcione mesmo passando pelo Nginx.
            proxy_http_version          1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout longo para o Angular dev server
            proxy_read_timeout 300s;
        }
    }
}